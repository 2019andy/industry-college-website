# ============================================================
# 生产环境 Docker Compose 编排
# 架构：Nginx（前端/反代）→ Next.js（后端 SSR+API）
# ============================================================
version: '3.8'

services:
  # ---- 后端：Next.js Standalone Server ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrnet-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # 持久化内容数据（content.json + auth.json）
      - content_data:/app/content
      # 持久化上传的图片
      - uploads_data:/app/public/uploads
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # 不暴露端口到宿主机，仅通过内网与 Nginx 通信
    expose:
      - '3000'

  # ---- 前端：Nginx 反向代理 + 静态资源 ----
  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: hrnet-frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # 挂载 Next.js 静态构建产物到 Nginx
      - next_static:/usr/share/nginx/html/_next/static:ro
      # 挂载上传图片目录（与 backend 共享）
      - uploads_data:/usr/share/nginx/html/uploads:ro
      # SSL 证书挂载
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Let's Encrypt 验证目录
      - ./nginx/certbot:/var/www/certbot:ro
      # Nginx 日志
      - nginx_logs:/var/log/nginx
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  internal:
    driver: bridge
    internal: false  # 需要外部访问 80/443

volumes:
  content_data:
    driver: local
  uploads_data:
    driver: local
  next_static:
    driver: local
  nginx_logs:
    driver: local
