# ============================================================
# Nginx 配置：前端容器（反向代理 + 静态资源 CDN + 安全防护）
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 6m;  # 略大于上传限制 5MB

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ---- 限流区域 ----
    # 通用 API 限流：每 IP 10 请求/秒
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 登录限流：每 IP 5 请求/分钟（防暴力破解）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # 上传限流：每 IP 3 请求/分钟
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=3r/m;

    # ---- 上游后端 ----
    upstream nextjs_backend {
        server backend:3000;
        keepalive 32;
    }

    # ---- HTTP → HTTPS 重定向 ----
    server {
        listen 80;
        server_name _;

        # ACME challenge（Let's Encrypt 证书验证）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其余全部重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS 主站 ----
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书（部署时替换为实际路径）
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---- 安全响应头 ----
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP：允许 inline style（Next.js 需要）、图片来源放宽（允许 data: 和上传图片）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none';" always;

        root /usr/share/nginx/html;
        index index.html;

        # ---- 静态资源：直接由 Nginx 提供（不经过 Node.js）----
        # Next.js 构建产物（JS/CSS chunks）
        location /_next/static/ {
            alias /usr/share/nginx/html/_next/static/;
            expires 365d;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # 用户上传的图片
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 30d;
            add_header Cache-Control "public" always;
            access_log off;

            # 仅允许图片文件
            location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
                # 防止图片被嵌入其他网站
                valid_referers none blocked self;
                if ($invalid_referer) {
                    return 403;
                }
            }
        }

        # favicon
        location = /favicon.ico {
            expires 30d;
            access_log off;
        }

        # ---- 登录接口：严格限流 ----
        location = /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://nextjs_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 文件上传接口：限流 ----
        location = /api/upload {
            limit_req zone=upload_limit burst=2 nodelay;
            client_max_body_size 6m;
            proxy_pass http://nextjs_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 其余 API：通用限流 ----
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://nextjs_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 其余所有请求：转发到 Next.js SSR ----
        location / {
            proxy_pass http://nextjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_redirect off;
        }
    }
}
